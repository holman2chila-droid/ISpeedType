<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <!-- fibras finas del papel -->
    <filter id="fibers" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.55" numOctaves="2" seed="7" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.30  0 0 0 0 0.20  0 0 0 0 0.10  0 0 0 0.55 -0.18"/>
    </filter>
    <!-- manchas grandes: papel envejecido -->
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.1"/></filter>
    <filter id="mottle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="21" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.30  0 0 0 0 0.16  0 0 0 0.55 -0.2"/>
    </filter>
  </defs>
  <!-- papel kraft -->
  <rect width="480" height="480" fill="#e2d7c5"/>
  <rect width="480" height="480" filter="url(#mottle)" opacity="0.55"/>
  <rect width="480" height="480" filter="url(#fibers)" opacity="0.5"/>
  <!-- arrugas: pares de línea oscura + clara, muy tenues -->
  <g fill="none" stroke-linecap="round" filter="url(#soft)">
    <path d="M-10 90 L120 60 L250 110 L380 70 L490 100" stroke="#6b5538" stroke-opacity="0.07" stroke-width="1.2"/>
    <path d="M-10 92.5 L120 62.5 L250 112.5 L380 72.5 L490 102.5" stroke="#fff6e4" stroke-opacity="0.2" stroke-width="1.2"/>
    <path d="M70 -10 L95 120 L60 250 L110 380 L90 490" stroke="#6b5538" stroke-opacity="0.06" stroke-width="1.1"/>
    <path d="M72.5 -10 L97.5 120 L62.5 250 L112.5 380 L92.5 490" stroke="#fff6e4" stroke-opacity="0.17" stroke-width="1.1"/>
    <path d="M-10 330 L140 360 L300 320 L420 370 L490 340" stroke="#6b5538" stroke-opacity="0.065" stroke-width="1.2"/>
    <path d="M-10 332.5 L140 362.5 L300 322.5 L420 372.5 L490 342.5" stroke="#fff6e4" stroke-opacity="0.18" stroke-width="1.2"/>
    <path d="M330 -10 L310 140 L360 260 L330 400 L350 490" stroke="#6b5538" stroke-opacity="0.055" stroke-width="1"/>
    <path d="M332.5 -10 L312.5 140 L362.5 260 L332.5 400 L352.5 490" stroke="#fff6e4" stroke-opacity="0.16" stroke-width="1"/>
  </g>
</svg>
